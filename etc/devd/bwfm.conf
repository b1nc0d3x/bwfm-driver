#
# Create the wlan interfaces listed in wlans_<dev> when a bwfm device
# becomes ready.  The driver posts this event once its firmware is up,
# which can be after rc's netif has run (the firmware download takes
# seconds) or long after boot for a device plugged in later.
# Interfaces that already exist are left alone.
#
# Install as /usr/local/etc/devd/bwfm.conf and restart devd.
#
notify 100 {
	match "system"	"BWFM";
	match "type"	"ATTACH";
	action "for w in $$(/usr/sbin/sysrc -n wlans_$subsystem 2>/dev/null); do /sbin/ifconfig $$w >/dev/null 2>&1 || /usr/sbin/service netif quietstart $$w; done";
};
